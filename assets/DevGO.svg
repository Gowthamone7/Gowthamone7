<circle class="dot" cx="298" cy="31" r="5" fill="#3178c6"/>
<text x="376" y="36" text-anchor="end" fill="#c9d1d9" class="f" style="font-size:12px">TypeScript</text>
<text x="24" y="66" fill="#8b949e" class="f" style="font-size:13px">Java Spring Boot project with RAG and GenAI</text>
<rect x="24" y="105" width="42" height="20" rx="10" fill="#1f2937" stroke="#30363d"/><text x="32" y="119" fill="#58a6ff" class="f" style="font-size:11px">Java</text><rect x="72.4" y="105" width="89" height="20" rx="10" fill="#1f2937" stroke="#30363d"/><text x="80.4" y="119" fill="#58a6ff" class="f" style="font-size:11px">Spring Boot</text><rect x="167.0" y="105" width="49" height="20" rx="10" fill="#1f2937" stroke="#30363d"/><text x="175.0" y="119" fill="#58a6ff" class="f" style="font-size:11px">GenAI</text><rect x="222.0" y="105" width="36" height="20" rx="10" fill="#1f2937" stroke="#30363d"/><text x="230.0" y="119" fill="#58a6ff" class="f" style="font-size:11px">RAG</text>
