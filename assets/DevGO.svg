@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.b{stroke-dasharray:140 60;animation:dash 6s linear infinite}
.dot{animation:pulse 2s ease-in-out infinite}
</style>
<rect x="1" y="1" width="398" height="138" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
<rect class="b" x="1" y="1" width="398" height="138" rx="14" fill="none" stroke="url(#gl)" stroke-width="2"/>
