<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" role="img" aria-label="Animated terminal typing code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
<clipPath id="k0"><rect class="c0" x="24" y="76" width="0" height="22"/></clipPath>
<clipPath id="k1"><rect class="c1" x="24" y="100" width="0" height="22"/></clipPath>
<clipPath id="k2"><rect class="c2" x="24" y="124" width="0" height="22"/></clipPath>
<clipPath id="k3"><rect class="c3" x="24" y="148" width="0" height="22"/></clipPath>
<clipPath id="k4"><rect class="c4" x="24" y="172" width="0" height="22"/></clipPath>
<clipPath id="k5"><rect class="c5" x="24" y="196" width="0" height="22"/></clipPath>
<clipPath id="k6"><rect class="c6" x="24" y="220" width="0" height="22"/></clipPath>
<clipPath id="k7"><rect class="c7" x="24" y="244" width="0" height="22"/></clipPath>
</defs>
<style>
.m{font-family:'Courier New',Consolas,monospace;font-size:14px}
@keyframes t0{0%,5.0%{width:0}10.63%,88.75%{width:71.2px}92.5%,100%{width:0}}
.c0{animation:t0 16.0s steps(8,end) infinite}
@keyframes t1{0%,14.37%{width:0}20.0%,88.75%{width:88.0px}92.5%,100%{width:0}}
.c1{animation:t1 16.0s steps(10,end) infinite}
@keyframes t2{0%,23.75%{width:0}29.38%,88.75%{width:138.4px}92.5%,100%{width:0}}
.c2{animation:t2 16.0s steps(16,end) infinite}
@keyframes t3{0%,33.12%{width:0}38.75%,88.75%{width:356.8px}92.5%,100%{width:0}}
.c3{animation:t3 16.0s steps(42,end) infinite}
@keyframes t4{0%,42.5%{width:0}48.12%,88.75%{width:163.6px}92.5%,100%{width:0}}
.c4{animation:t4 16.0s steps(19,end) infinite}
@keyframes t5{0%,51.88%{width:0}57.5%,88.75%{width:172.0px}92.5%,100%{width:0}}
.c5{animation:t5 16.0s steps(20,end) infinite}
@keyframes t6{0%,61.25%{width:0}66.88%,88.75%{width:163.6px}92.5%,100%{width:0}}
.c6{animation:t6 16.0s steps(19,end) infinite}
@keyframes t7{0%,70.62%{width:0}76.25%,88.75%{width:188.8px}92.5%,100%{width:0}}
.c7{animation:t7 16.0s steps(22,end) infinite}
@keyframes cur{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes showcur{0%,80.0%{opacity:0}80.62%,88.75%{opacity:1}92.5%,100%{opacity:0}}
.cursor{animation:showcur 16.0s infinite}.blink{animation:cur 1s infinite}
</style>
<rect x="1" y="1" width="438" height="318" rx="12" fill="url(#bg)" stroke="url(#glow)" stroke-width="2"/>
<rect x="1" y="1" width="438" height="34" rx="12" fill="#21262d"/>
<rect x="1" y="22" width="438" height="13" fill="#21262d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="220.0" y="23" text-anchor="middle" fill="#8b949e" class="m" style="font-size:12px">gowtham@dev: ~/projects</text>
<text x="24" y="92" fill="#7ee787" clip-path="url(#k0)" class="m">$ whoami</text>
<text x="24" y="116" fill="#e6edf3" clip-path="url(#k1)" class="m">gowtham-kc</text>
<text x="24" y="140" fill="#7ee787" clip-path="url(#k2)" class="m">$ cat stack.java</text>
<text x="24" y="164" fill="#79c0ff" clip-path="url(#k3)" class="m">String[] stack = {"Java", "Spring", "AI"};</text>
<text x="24" y="188" fill="#7ee787" clip-path="url(#k4)" class="m">$ mvn clean install</text>
<text x="24" y="212" fill="#56d364" clip-path="url(#k5)" class="m">[INFO] BUILD SUCCESS</text>
<text x="24" y="236" fill="#7ee787" clip-path="url(#k6)" class="m">$ ./ship --projects</text>
<text x="24" y="260" fill="#e3b341" clip-path="url(#k7)" class="m">Deployed to production</text>
<g class="cursor"><text x="24" y="284" fill="#7ee787" class="m">$</text><rect class="blink" x="40.8" y="270" width="8" height="17" fill="#36BCF7"/></g>
</svg>
