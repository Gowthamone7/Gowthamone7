<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Gowtham KC - animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset=".5" stop-color="#151a33"/><stop offset="1" stop-color="#1b1233"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36BCF7"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#ff7ac6"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset=".5" stop-color="#36BCF7" stop-opacity=".18"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="55"/></filter>
<clipPath id="clip"><rect x="2" y="2" width="996" height="296" rx="22"/></clipPath>
</defs>
<style>
.f{font-family:'Segoe UI','Trebuchet MS',Helvetica,Arial,sans-serif}
.m{font-family:'Courier New',Consolas,monospace}
@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}85%{opacity:.45}100%{transform:translateY(-380px) rotate(12deg);opacity:0}}
.g{font-family:'Courier New',Consolas,monospace;font-weight:700;animation:float linear infinite}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
.sw{animation:sweep 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:2200;fill-opacity:0}32%{stroke-dashoffset:0;fill-opacity:0}46%,88%{stroke-dashoffset:0;fill-opacity:1}96%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:2200;fill-opacity:0}}
.nm{stroke-dasharray:2200;stroke-dashoffset:2200;fill-opacity:0;animation:draw 12s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
.gl{animation:pulse 3s ease-in-out infinite}
@keyframes line{0%,30%{transform:scaleX(0);opacity:0}45%,88%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(0);opacity:0}}
.ul{transform-origin:500px 0;transform-box:fill-box;animation:line 12s ease-in-out infinite}
@keyframes fade{0%,38%{opacity:0;transform:translateY(8px)}52%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
.s1{animation:fade 12s ease-in-out infinite}
.s2{animation:fade 12s ease-in-out .35s infinite}
@keyframes dash{to{stroke-dashoffset:-1000}}
.bd{stroke-dasharray:220 120;animation:dash 8s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cu{animation:blink 1s infinite}
</style>
<rect x="2" y="2" width="996" height="296" rx="22" fill="url(#bg)"/>
<g clip-path="url(#clip)">
<rect width="1000" height="300" fill="url(#grid)"/>
<circle cx="130" cy="60" r="140" fill="#36BCF7" opacity=".10" filter="url(#glow)" class="gl"/>
<circle cx="880" cy="250" r="170" fill="#a371f7" opacity=".14" filter="url(#glow)" class="gl" style="animation-delay:1.5s"/>
<rect class="sw" x="0" y="0" width="300" height="300" fill="url(#scan)"/>
<text class="g" x="371" y="330" fill="#36BCF7" style="font-size:16px;animation-duration:11.7s;animation-delay:-4.6s">{ }</text>
<text class="g" x="880" y="330" fill="#a371f7" style="font-size:16px;animation-duration:9.7s;animation-delay:-3.5s">&lt;/&gt;</text>
<text class="g" x="78" y="330" fill="#36BCF7" style="font-size:20px;animation-duration:7.4s;animation-delay:-3.1s">01</text>
<text class="g" x="604" y="330" fill="#a371f7" style="font-size:16px;animation-duration:9.1s;animation-delay:-7.5s">=&gt;</text>
<text class="g" x="685" y="330" fill="#36BCF7" style="font-size:28px;animation-duration:10.1s;animation-delay:-9.6s">();</text>
<text class="g" x="266" y="330" fill="#58a6ff" style="font-size:24px;animation-duration:7.2s;animation-delay:-6.2s">AI</text>
<text class="g" x="187" y="330" fill="#36BCF7" style="font-size:20px;animation-duration:9.7s;animation-delay:-5.5s">[ ]</text>
<text class="g" x="635" y="330" fill="#36BCF7" style="font-size:16px;animation-duration:9.9s;animation-delay:-1.9s">#</text>
<text class="g" x="617" y="330" fill="#7ee787" style="font-size:28px;animation-duration:7.3s;animation-delay:-1.5s">&amp;&amp;</text>
<text class="g" x="516" y="330" fill="#a371f7" style="font-size:24px;animation-duration:9.9s;animation-delay:-4.5s">fn</text>
<text class="g" x="853" y="330" fill="#7ee787" style="font-size:16px;animation-duration:7.9s;animation-delay:-6.2s">JVM</text>
<text class="g" x="577" y="330" fill="#7ee787" style="font-size:28px;animation-duration:9.5s;animation-delay:-3.3s">SQL</text>
<text class="g" x="663" y="330" fill="#a371f7" style="font-size:28px;animation-duration:11.9s;animation-delay:-1.4s">git</text>
<text class="g" x="815" y="330" fill="#36BCF7" style="font-size:28px;animation-duration:8.7s;animation-delay:-8.1s">*</text>
</g>
<rect class="bd" x="2" y="2" width="996" height="296" rx="22" fill="none" stroke="url(#name)" stroke-width="3"/>
<rect x="2" y="2" width="996" height="296" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text x="500" y="52" text-anchor="middle" fill="#7ee787" class="m" style="font-size:15px">&gt; hello_world<tspan class="cu" fill="#36BCF7">_</tspan></text>
<text x="500" y="165" text-anchor="middle" class="f nm" fill="url(#name)" stroke="url(#name)" stroke-width="2" style="font-size:104px;font-weight:800;letter-spacing:8px">GOWTHAM KC</text>
<rect class="ul" x="260" y="188" width="480" height="4" rx="2" fill="url(#name)"/>
<text x="500" y="228" text-anchor="middle" fill="#c9d1d9" class="f s1" style="font-size:20px;letter-spacing:2px">B.Tech CSE  |  REVA University  |  Class of 2027</text>
<text x="500" y="260" text-anchor="middle" fill="#36BCF7" class="m s2" style="font-size:16px">Java • Spring Boot • AI Automation Testing</text>
</svg>
